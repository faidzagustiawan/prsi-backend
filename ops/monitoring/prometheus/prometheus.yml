global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: prsi
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/prsi-token
    static_configs:
      - targets: ['10.11.26.196:9443']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100', '10.11.26.196:9100']
  - job_name: sync-checker
    static_configs:
      - targets: ['127.0.0.1:9199']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: blackbox
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs:
      - targets: ['https://podorukunsi.my.id/health', 'http://10.11.26.196:3201/health']
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: '127.0.0.1:9115'}
