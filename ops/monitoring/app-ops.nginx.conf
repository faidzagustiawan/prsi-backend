# Install only after merge and the application's backup/smoke-test deployment.
# Plain HTTP only on Tencent private network, restricted to monitoring host.
server {
    listen 10.11.26.196:9443;
    server_name _;
    allow 10.11.20.216;
    deny all;
    access_log off;
    location /internal/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
