# Install only after merge and the application's backup/smoke-test deployment.
# Plain HTTP only on Tencent private network, restricted to monitoring host.
server {
    listen 10.11.26.196:9443;
    server_name _;
    allow 10.11.20.216;
    deny all;
    access_log off;
    location /internal/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    # Read-only relay so the monitoring checker can compare PRSI with Track
    # PRODUCTION (sync.podorukuntrack.com only allows this host's IP).
    # /etc/nginx/prsi-track-auth.conf (root 600) holds one line:
    #   proxy_set_header Authorization "Bearer <token>";
    # Never commit that file. Update it whenever the token is rotated.
    location ~ ^/track-checksum/(companies|projects|clusters|units|customers|assignments|payments)$ {
        limit_except GET { deny all; }
        proxy_pass https://sync.podorukuntrack.com/sync/v2/checksum/$1;
        resolver 127.0.0.53 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host sync.podorukuntrack.com;
        include /etc/nginx/prsi-track-auth.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
